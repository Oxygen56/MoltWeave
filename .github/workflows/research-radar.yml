name: research radar
on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/cache@v4
        with:
          path: state/research
          key: research-state-${{ github.run_id }}
          restore-keys: research-state-
      - name: Discover and prepare public research for review
        env:
          MOLTWEAVE_API_KEY: ${{ secrets.MOLTWEAVE_API_KEY }}
          MOLTWEAVE_API_BASE: ${{ vars.MOLTWEAVE_API_BASE || 'https://api.deepseek.com' }}
          MOLTWEAVE_MODEL: ${{ vars.MOLTWEAVE_MODEL || 'deepseek-flash' }}
        run: |
          if [ -n "$MOLTWEAVE_API_KEY" ]; then
            python scripts/daily_research.py --store state/research --model
          else
            python scripts/daily_research.py --store state/research
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-discovery
          path: state/research
          retention-days: 14
